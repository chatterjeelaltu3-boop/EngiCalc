<!-- ADMIN SECTION -->
<section id="admin" class="section">
    <div class="admin-container">
        <h2>Admin Panel</h2>
        
        <!-- Admin Dashboard (Hidden by default) -->
        <div id="adminDashboard" style="display:none;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
                <h3>Admin Dashboard</h3>
                <button class="btn-secondary" onclick="adminLogout()">🚪 Logout</button>
            </div>
            
            <div class="admin-tabs">
                <button class="admin-tab active" data-tab="questions">Questions</button>
                <button class="admin-tab" data-tab="topics">Topics</button>
                <button class="admin-tab" data-tab="formulas">Formulas</button>
                <button class="admin-tab" data-tab="settings">Settings</button>
            </div>

            <!-- Admin - Questions -->
            <div id="adminQuestions" class="admin-panel active">
                <h3>Manage Questions</h3>
                <button class="btn-primary" onclick="showAddQuestion()">+ Add Question</button>
                <div id="questionBank" class="question-bank"></div>
            </div>

            <!-- Admin - Topics -->
            <div id="adminTopics" class="admin-panel">
                <h3>Manage Topics</h3>
                <div class="topic-form">
                    <input type="text" id="newTopic" placeholder="New Topic Name">
                    <button class="btn-primary" onclick="addTopic()">Add Topic</button>
                </div>
                <div id="topicList" class="topic-list"></div>
            </div>

            <!-- Admin - Formulas -->
            <div id="adminFormulas" class="admin-panel">
                <h3>Manage Formulas</h3>
                <button class="btn-primary" onclick="showAddFormula()">+ Add Formula</button>
                <div id="adminFormulaList" class="formula-admin-list"></div>
            </div>

            <!-- Admin - Settings -->
            <div id="adminSettings" class="admin-panel">
                <h3>Quiz Settings</h3>
                <div class="settings-group">
                    <h4>Easy Quiz</h4>
                    <div class="setting-row">
                        <label>Questions: <input type="number" id="easyQuestions" value="10"></label>
                        <label>Time (min): <input type="number" id="easyTime" value="10"></label>
                    </div>
                </div>
                <div class="settings-group">
                    <h4>Medium Quiz</h4>
                    <div class="setting-row">
                        <label>Questions: <input type="number" id="mediumQuestions" value="20"></label>
                        <label>Time (min): <input type="number" id="mediumTime" value="20"></label>
                    </div>
                </div>
                <div class="settings-group">
                    <h4>Hard Quiz</h4>
                    <div class="setting-row">
                        <label>Questions: <input type="number" id="hardQuestions" value="30"></label>
                        <label>Time (min): <input type="number" id="hardTime" value="45"></label>
                    </div>
                </div>
                <button class="btn-primary" onclick="saveSettings()">Save Settings</button>
            </div>
        </div>
    </div>
</section>

<!-- Password Modal - শুধু Admin এর জন্য -->
<div id="adminPasswordModal" class="modal" style="display:none;">
    <div class="modal-content" style="max-width:400px;">
        <span class="modal-close" onclick="closePasswordModal()">&times;</span>
        <h3 style="text-align:center;margin-bottom:1.5rem;">🔐 Admin Access</h3>
        <div class="form-group">
            <label>Enter Password</label>
            <input type="password" id="adminPasswordInput" placeholder="Enter admin password" 
                   onkeydown="if(event.key==='Enter') verifyAdminPassword()">
        </div>
        <button class="btn-primary" onclick="verifyAdminPassword()" style="width:100%;">Unlock Admin Panel</button>
        <p id="passwordError" style="color:red;display:none;text-align:center;margin-top:0.5rem;">❌ Wrong password! Try again.</p>
    </div>
</div>
